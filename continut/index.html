<!DOCTYPE html>
<html lang="ro">
<head>

    <meta charset="UTF-8">
    <title>SitePW</title>
    <link rel="stylesheet" href="css/stil.css">
    <script>
function schimbaContinut(fisier, jsFisiere, jsFunctie, argumenteFunctie) {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            document.getElementById("continut").innerHTML = this.responseText;

            var listaFisiere = Array.isArray(jsFisiere) ? jsFisiere : (jsFisiere ? [jsFisiere] : []);

            function incarcaScripturi(index) {
                if (index < listaFisiere.length) {
                    var elementScript = document.createElement('script');
                    elementScript.src = listaFisiere[index];
                    elementScript.onload = function () {
                        console.log("Script încărcat: " + listaFisiere[index]);
                        incarcaScripturi(index + 1); 
                    };
                    document.head.appendChild(elementScript);
                } else {
                    if (jsFunctie && typeof window[jsFunctie] === "function") {
                        var args = Array.isArray(argumenteFunctie) ? argumenteFunctie : (argumenteFunctie !== undefined ? [argumenteFunctie] : []);
                        window[jsFunctie](...args);
                    }
                }
            }

            incarcaScripturi(0);
        }
    };
    xhttp.open("GET", fisier + ".html", true);
    xhttp.send();
}
    </script>
</head>
<body onload="schimbaContinut('acasa')">
<header>
    <nav>
        <a onclick="schimbaContinut('l2_al_meu', null, null)">Despre</a>
        <a onclick="schimbaContinut('inregistreaza', 'js/persoane.js', null)">Inregistrează-te</a>
        <a onclick="schimbaContinut('video', null, null)">Video</a>
        <a onclick="schimbaContinut('acasa', null, null)">Home</a>
        <a onclick="schimbaContinut('desen', null, null)">Desen</a>                      
        <a onclick="schimbaContinut('invat', 'js/script.js', 'initPage')">Invat</a>                     
        <a onclick="schimbaContinut('cumparaturi', ['js/cumparaturi.js','js/worker.js'], null)">Cos</a>
        <a onclick="schimbaContinut('verifica', 'js/persoane.js', null)">Verifică Login</a>
        <a onclick="schimbaContinut('persoane', 'js/persoane.js', 'incarcaPersoane')">Persoane</a>
    </nav>
</header>


    <hr>

    <main id="continut">
    </main>

    <hr>


</body>
</html>
