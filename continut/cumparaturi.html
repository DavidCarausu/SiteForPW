    
    
    <section>
        <div id="formular-produs">
            <label for="nume">Produs:</label>
            <input type="text" id="nume" placeholder="Ex: Mere">
            
            <label for="cantitate">Cantitate:</label>
            <input type="number" id="cantitate" placeholder="Ex: 5">
            <div >
                <span>Stocare în:</span>
                <input type="radio" id="stocare-local" name="tip-stocare" value="local" checked>
                <label for="stocare-local">LocalStorage</label>
                
                <input type="radio" id="stocare-index" name="tip-stocare" value="index">
                <label for="stocare-index">IndexedDB</label>
            </div>
            <button id="btn-adauga" type="button">Adaugă în listă</button>
        </div>
    </section>

    <section>
        <h3>Produse adăugate:</h3>
        <table border="1" id="tabel-cumparaturi">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nume</th>
                    <th>Cantitate</th>
                </tr>
            </thead>
            <tbody id="lista-produse">
                </tbody>
        </table>
    </section>
