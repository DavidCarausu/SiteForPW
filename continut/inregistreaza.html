
    <form id="login" name="login">
        <label for="nume-utilizator">Nume Utilizator:</label>
        <input type="text" id="nume-utilizator" name="nume utilizator"><br>

        <label for="pass">Parola:</label>
        <input type="password" id="pass" name="pass"><br>

        <label for="nume">Nume:</label>
        <input type="text" id="nume" name="nume" value="n"><br>

        <label for="prenume">Prenume:</label>
        <input type="text" id="prenume" name="prenume"><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br>

        <label for="tel">Telefon:</label>
        <input type="tel" name="tel" id="name">
    </form>

    <form id="signup" name="signup">
        <label for="sex">Sex:</label>
        <select id="sex" name="sex">
            <option value="Male">MALE</option>
            <option value="Female">FEMALE</option>
            <option value="rosu">altceva</option>
        </select>
        <br>

        <label for="Input-topic">Design pattern preferat:</label>
        <input list="Pattern" id="Input-topic" name="Patter-Preferat">
        <datalist id="Pattern">
            <option value="MVC"></option>
        </datalist><br>

        <label for="color">Culoare preferata:</label>
        <input type="color" name="color"><br>

        <label for="data-nastere">Data nasteri:</label>
        <input type="date" id="data-nastere" name="data-nastere"><br>

        <label for="ora-nastere">Ora nasteri:</label>
        <input type="time" id="ora-nastere" name="ora-nastere"><br>

        <label for="varsta">Varsta:</label>
        <input type="range" id="varsta" name="varsta" min=0 max="150" value="20"><br>

        <label for="url">URL personal:</label>
        <input type="url" id="url" name="url"><br>


        <label for="desc">Descriere:</label><br>
        <textarea id="desc" name="desc" rows="4" cols="30" style="overflow: scroll;"></textarea><br><br>
        <input type="checkbox" id="terms" name="terms">

        <button type="button" id="btn-submit" onclick="inregistreaza()">Inregistreaza</button>
    </form>
