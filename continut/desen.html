
    <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:rgb(255,255,0);stop-opacity:1" />
                <stop offset="100%" style="stop-color:rgb(255,165,0);stop-opacity:1" />
            </linearGradient>
        </defs>

        <g id="user">
            <circle cx="100" cy="180" r="20" fill="#f0d0b0" stroke="black" /> <line x1="100" y1="200" x2="100" y2="260" stroke="black" stroke-width="2" /> <line x1="100" y1="220" x2="70" y2="240" stroke="black" stroke-width="2" /> <line x1="100" y1="220" x2="130" y2="240" stroke="black" stroke-width="2" /> <line x1="100" y1="260" x2="80" y2="300" stroke="black" stroke-width="2" /> <line x1="100" y1="260" x2="120" y2="300" stroke="black" stroke-width="2" /> <text x="100" y="330" text-anchor="middle" font-weight="bold">Utilizator</text>
        </g>

        <g id="controller">
            <polygon points="300,120 500,120 530,50 270,50" fill="url(#grad1)" stroke="black" stroke-width="2" />
            <text x="400" y="95" text-anchor="middle" font-weight="bold">CONTROLLER</text>
        </g>

        <g id="model">
            <circle cx="650" cy="230" r="60" fill="#99ff99" stroke="black" stroke-width="2" />
            <text x="650" y="235" text-anchor="middle" font-weight="bold">MODEL</text>
        </g>

        <g id="view">
            <polygon points="400,340 320,460 480,460" fill="#99ccff" stroke="black" stroke-width="2" />
            <text x="400" y="430" text-anchor="middle" font-weight="bold">VIEW</text>
        </g>

        <line x1="140" y1="200" x2="270" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="180" y="140" font-size="12" transform="rotate(-35, 180, 140)">Utilizează</text>

        <line x1="530" y1="100" x2="600" y2="180" stroke="black" stroke-width="2" />
        <text x="560" y="130" font-size="12">Modifică</text>
        
        <line x1="520" y1="100" x2="600" y2="190" stroke="black" stroke-width="2" />
        <text x="490" y="160" font-size="12">Actualizează 1</text>

        <line x1="400" y1="130" x2="400" y2="320" stroke="black" stroke-width="2" />
        <text x="420" y="250" font-size="12">Actualizează 2</text>

        <line x1="320" y1="400" x2="140" y2="280" stroke="black" stroke-width="2" />
        <text x="210" y="360" font-size="12">Vede</text>

        <rect x="700" y="10" width="40" height="40" fill="red" opacity="0.5" />
    </svg>

    <p>Această diagramă reprezintă fluxul MVC: Utilizatorul interacționează cu Controller-ul, care modifică Modelul, care la rândul său actualizează View-ul pe care îl vede utilizatorul.</p>
